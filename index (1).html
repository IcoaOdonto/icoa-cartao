<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icoa Odontologia</title>

<style>
/* layout: uma coluna centrada, cartão de contato; ground navy do logo, botões brancos */
:root{--bg:#1E2A5E;--bg2:#243370;--fg:#FFFFFF;--muted:#C9CFE6;--btn:#FFFFFF;--btn-fg:#1E2A5E;--wa:#25D366;--font:'Montserrat',Arial,Helvetica,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.logo{width:200px;height:200px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.logo img{width:170px;height:170px;object-fit:contain}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:10px;text-indent:10px}
.sub{margin:6px 0 0;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.frase{margin:0;font-size:20px;font-weight:500;max-width:28ch;text-wrap:balance}
.btns{display:flex;flex-direction:column;gap:14px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--btn);color:var(--btn-fg);text-decoration:none;font-weight:600;font-size:17px;min-height:58px;border-radius:999px;padding:0 24px}
.btn:focus-visible{outline:3px solid var(--muted);outline-offset:3px}
.btn.sorteio{background:#F2C94C;color:#1E2A5E}
.btn.wa{background:var(--wa);color:#0B2E1A}
.btn.map{background:transparent;color:var(--fg);border:2px solid rgba(255,255,255,.55)}
.btn svg{flex:none}
.end{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .12s}.btn:active{transform:scale(.97)}
</style>
</head>
